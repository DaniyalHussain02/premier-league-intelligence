name: Forecast fixture verification

on:
  schedule:
    - cron: '17 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forecast-publish
  cancel-in-progress: false

jobs:
  fixture-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r engine/requirements.lock'
      - run: python -m pip install --no-build-isolation --no-deps -e ./engine
      - name: Verify fixture publication and production gate
        run: python -m pytest engine/tests/integration/test_forecast_workflow.py -q
